{% extends "auth/base_auth.html" %}
{% block title %}Sign In — ZURI{% endblock %}
{% block form %}
<div class="auth-card">
  <div class="auth-card-header">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to your ZURI wallet</p>
  </div>
  <form method="POST" class="auth-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field-group">
      <label class="field-label">Email</label>
      <input type="email" name="email" class="field-input" placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="field-group">
      <div class="field-label-row">
        <label class="field-label" style="margin-bottom:0;">Password</label>
        <a href="{{ url_for('forgot_password') }}" class="field-link">Forgot?</a>
      </div>
      <div class="field-wrap" style="margin-top:7px;">
        <input type="password" name="password" id="pwField" class="field-input" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="pw-toggle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);" onclick="togglePw('pwField',this)">👁</button>
      </div>
    </div>
    <button type="submit" class="auth-btn">
      <span>Sign in</span><span class="btn-arrow">→</span>
    </button>
  </form>
  <div class="auth-divider"><span>or</span></div>
  <div class="auth-footer-text">
    No account? <a href="{{ url_for('signup') }}" class="auth-link">Create one free →</a>
  </div>
  
</div>
{% endblock %}

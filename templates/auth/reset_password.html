{% extends "auth/base_auth.html" %}
{% block title %}New Password — {{ brand_name }}{% endblock %}
{% from '_icons.html' import icon %}
{% block form %}
<div class="auth-card">
  <div class="auth-card-header">
    <div class="auth-icon-circle">{{ icon('lock', 22) }}</div>
    <h1 class="auth-title">Set new password</h1>
    <p class="auth-sub">Choose a strong password for your account.</p>
  </div>
  <form method="POST" class="auth-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field-group">
      <label class="field-label">New Password</label>
      <div class="field-wrap">
        <input type="password" name="password" id="pwField" class="field-input" placeholder="Min. 8 characters" required minlength="8">
        <button type="button" class="pw-toggle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);" onclick="togglePw('pwField',this)">{{ icon('eye',16) }}</button>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Confirm Password</label>
      <div class="field-wrap">
        <input type="password" name="confirm" id="cfField" class="field-input" placeholder="Repeat password" required minlength="8">
        <button type="button" class="pw-toggle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);" onclick="togglePw('cfField',this)">{{ icon('eye',16) }}</button>
      </div>
    </div>
    <button type="submit" class="auth-btn">
      <span>Update password</span><span class="btn-arrow">→</span>
    </button>
  </form>
  <div class="auth-footer-text" style="margin-top:16px;">
    <a href="{{ url_for('login') }}" class="auth-link">← Back to sign in</a>
  </div>
</div>
{% endblock %}

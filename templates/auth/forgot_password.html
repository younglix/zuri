{% extends "auth/base_auth.html" %}
{% block title %}Forgot Password — ZURI{% endblock %}
{% from '_icons.html' import icon %}
{% block form %}
<div class="auth-card">
  <div class="auth-card-header">
    <div class="auth-icon-circle">{{ icon('key', 22) }}</div>
    <h1 class="auth-title">Reset password</h1>
    <p class="auth-sub">Enter your email and we'll send a reset link.</p>
  </div>
  <form method="POST" class="auth-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field-group">
      <label class="field-label">Email Address</label>
      <input type="email" name="email" class="field-input" placeholder="you@example.com" required autocomplete="email">
    </div>
    <button type="submit" class="auth-btn">
      <span>Send reset link</span><span class="btn-arrow">→</span>
    </button>
  </form>
  <div class="auth-footer-text" style="margin-top:16px;">
    <a href="{{ url_for('login') }}" class="auth-link">← Back to sign in</a>
  </div>
</div>
{% endblock %}

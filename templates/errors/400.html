<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>400 — {{ brand_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    html{font-size:clamp(15px,calc(14px + .15vw),17px);}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#020204;font-family:'Plus Jakarta Sans',sans-serif;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
      background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);background-size:60px 60px;}
    .card{background:rgba(17,17,28,.7);border:1px solid rgba(99,102,241,.2);border-radius:24px;padding:56px 40px;max-width:460px;width:100%;backdrop-filter:blur(20px);}
    .num{font-size:6rem;font-weight:900;line-height:1;font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,#818cf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    h1{font-size:1.5rem;font-weight:800;margin:14px 0 10px;}
    p{color:#94a3b8;line-height:1.6;margin-bottom:28px;font-size:.92rem;}
    .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
    .btn{display:inline-block;padding:12px 26px;border-radius:10px;font-weight:700;font-size:.88rem;text-decoration:none;transition:all .2s;}
    .btn-p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.3);}
    .btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.45);}
    .btn-o{border:1px solid rgba(129,140,248,.3);color:#94a3b8;}
    .btn-o:hover{border-color:rgba(129,140,248,.7);color:#f1f5f9;}
  </style>
</head>
<body>
  <div class="card">
    <div class="num">400</div>
    <h1>Bad Request</h1>
    <p>Your request contained invalid or suspicious content and was blocked.</p>
    <div class="btns">
      <a href="/" class="btn btn-p">← Home</a>
      <a href="/dashboard" class="btn btn-o">Dashboard</a>
    </div>
  </div>
</body>
</html>
